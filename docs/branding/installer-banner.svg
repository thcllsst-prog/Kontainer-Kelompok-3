<svg xmlns="http://www.w3.org/2000/svg" width="800" height="75" viewBox="0 0 800 75">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b1b33"/>
      <stop offset="1" stop-color="#0f4c81"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="75" fill="url(#bg)"/>
  <!-- logo: tumpukan kontainer -->
  <g transform="translate(300 10)">
    <rect x="0"  y="38" width="22" height="16" rx="3" fill="url(#box)"/>
    <rect x="25" y="38" width="22" height="16" rx="3" fill="url(#box)"/>
    <rect x="12" y="20" width="22" height="16" rx="3" fill="url(#box)" opacity="0.9"/>
    <rect x="37" y="20" width="22" height="16" rx="3" fill="url(#box)" opacity="0.9"/>
    <rect x="24" y="2"  width="22" height="16" rx="3" fill="url(#box)" opacity="0.8"/>
  </g>
  <text x="375" y="47" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700" fill="#ffffff">KontainerOS</text>
</svg>
