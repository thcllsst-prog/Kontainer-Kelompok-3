# Preseed installer KontainerOS (debian-installer mode live)
# Bahasa, zona waktu, dan pengguna awal. Kata sandi sengaja TIDAK di-preseed,
# installer akan menanyakannya.

d-i debian-installer/locale string id_ID.UTF-8
d-i debian-installer/language string id
d-i debian-installer/country string ID
d-i localechooser/supported-locales multiselect id_ID.UTF-8, en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

d-i time/zone string Asia/Makassar
d-i clock-setup/utc boolean true

d-i netcfg/get_hostname string kontaineros
d-i netcfg/get_domain string local

d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Developer
d-i passwd/username string dev
d-i passwd/user-default-groups string audio cdrom video plugdev netdev sudo docker

d-i popularity-contest/participate boolean false
d-i grub-installer/with_other_os boolean true
